# docker compose up -d --build
# 映射到宿主机 4321 端口；数据持久化在命名卷 readbook-data 中。
services:
  readbook:
    build:
      context: .
      dockerfile: Dockerfile
    image: readbook:latest
    container_name: readbook
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      # 不再提供弱默认值：SESSION_SECRET 缺失时直接报错，避免用公开串签发会话。
      # 改完必须 `docker compose up -d`（restart 不会重新注入环境变量）。
      SESSION_SECRET: ${SESSION_SECRET:?请先在 .env 或环境变量里设置 SESSION_SECRET（随机长字符串）}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # 留空 = 不启用配置管理员，第一个注册的账号成为站长（避免默认 admin/admin）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ONLINE_DICT_URL: ${ONLINE_DICT_URL:-}
      ONLINE_TRANSLATE_URL: ${ONLINE_TRANSLATE_URL:-}
    volumes:
      - readbook-data:/app/data
    # 2C2G 服务器保护：容器最多 1G，避免词库/正文把宿主机撑爆
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  readbook-data:
